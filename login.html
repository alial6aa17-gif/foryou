<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الموظفين | FOR YOU</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#ffeaf2,#fff9fc 55%);font-family:system-ui,Tahoma;color:#513b47;padding:18px}.card{width:min(430px,100%);background:white;border:1px solid #f0dce5;border-radius:28px;padding:28px;box-shadow:0 20px 60px #b76c8d20}.logo{width:82px;height:82px;border-radius:50%;display:block;margin:auto auto 14px;object-fit:cover;background:#fff0f6}h1{text-align:center;font-size:23px;margin:0 0 5px}p{text-align:center;color:#987e8b;margin:0 0 25px;font-size:13px}.field{display:block;width:100%;padding:14px;border:1px solid #efd9e4;border-radius:15px;margin:10px 0;background:#fffafd;font:inherit;outline-color:#d98eb2}.btn{width:100%;padding:14px;border:0;border-radius:15px;background:#c66d96;color:white;font-weight:800;font:inherit;cursor:pointer;margin-top:8px}.error,.warning{padding:12px;border-radius:13px;background:#fff0f6;color:#8c4164;font-size:13px;margin-top:12px}.back{display:block;text-align:center;margin-top:20px;color:#9b7185;font-size:13px}
</style></head><body><main class="card"><img class="logo" src="/assets/logo.png" onerror="this.style.display='none'"><h1>أهلاً بفريق فور يو 🌸</h1><p>سجّلي الدخول للوصول إلى لوحة العمل</p><form onsubmit="login(event)"><input class="field" id="username" autocomplete="username" placeholder="اسم المستخدم" required><input class="field" id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required><button class="btn">تسجيل الدخول</button></form><div id="msg"></div><a class="back" href="/">العودة إلى المتجر</a></main><script>
async function login(e){e.preventDefault();let msg=document.getElementById('msg');msg.innerHTML='';try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})}),j=await r.json();if(!r.ok)throw Error(j.error);if(j.warning)msg.innerHTML='<div class="warning">تنبيه أمني: تستخدمين كلمة المرور الافتراضية. غيّريها فوراً قبل نشر النظام.</div>';location.href='/dashboard';}catch(err){msg.innerHTML='<div class="error">'+String(err.message).replace(/[&<>"]/g,'')+'</div>';}}
</script></body></html>
